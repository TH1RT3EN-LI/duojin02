# Fixed-map AMCL only. Endpoints use the pinned AMCL/Karto nearest-cell map
# convention without shifting saved map origin or poses. Rotated maps fail closed.
localization_manager:
  ros__parameters:
    map_cell_convention: amcl_nearest
    min_hits: 45
    max_beams: 90
    max_range: 8.0
    hit_fraction: 0.75
    known_fraction: 0.90
    max_contradiction_fraction: 0.15
    endpoint_tolerance: 0.12
    ray_margin: 0.18
    max_ray_cells: 50000
    good_scans: 6
    good_span_s: 0.5
    bad_scans: 3
    bad_span_s: 0.2
    recovery_scans: 15
    recovery_span_s: 1.4
    scan_timeout_s: 0.4
    recovery_max_attempts: 2
    recovery_attempt_timeout_s: 8.0
    command_timeout_s: 0.25
