base_driver:
  ros__parameters:
    use_sim_time: false
    loop_hz: 200
    odom_x_scale: 1.0
    odom_y_scale: 1.0
    odom_z_scale_positive: 1.0
    odom_z_scale_negative: 1.0
    # Preserve existing weighting until noise and gyro bias are measured on the robot.
    imu_yaw_rate_bias: 0.0
    imu_yaw_rate_variance: 0.000001
    odom_twist_variances_moving: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    odom_twist_variances_stopped: [0.000000001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.000000001]
